<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!--
    The Kira brand mark: "stem + bars". A receipt-shaped outline whose zigzag
    bottom reads as a K, with a vertical stem and three sticker-colored
    category bars.

    This file is the single source of truth for the mark's geometry. The icon
    generation script (scripts/generate-icons.ts) and the KiraMark component
    (src/ui/KiraMark.tsx) both derive from it — the coordinates below must stay
    byte-identical across all three.

    `currentColor` drives the outline and stem, so the mark can sit on any
    surface. The three bars are fixed brand colors and never re-tint.
  -->
  <path
    d="M30 22 H70 V72 L63.3 77 L56.7 72 L50 77 L43.3 72 L36.7 77 L30 72 Z"
    stroke="currentColor"
    stroke-width="5.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />
  <rect x="38" y="32.5" width="6" height="30.5" rx="3" fill="currentColor" />
  <rect x="47" y="32.5" width="15" height="6.5" rx="3.25" fill="#62aef0" />
  <rect x="47" y="44.5" width="8" height="6.5" rx="3.25" fill="#d6b6f6" />
  <rect x="47" y="56.5" width="15" height="6.5" rx="3.25" fill="#ff64c8" />
</svg>
