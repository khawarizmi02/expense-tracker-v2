name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Typecheck & core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Core test suite
        run: npm test -- --ci
